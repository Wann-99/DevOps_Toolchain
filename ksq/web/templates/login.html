<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录 · DevOps Toolchain</title>
  <link rel="icon" type="image/png" href="/static/logo.png">
  <link rel="stylesheet" href="/static/app.css">
  <style>
    body.login-body { display:grid; place-items:center; min-height:100vh; padding:20px; }
    .login-card { width:min(400px,100%); background:var(--card); border:1px solid var(--line); border-radius:22px; padding:44px 36px 36px; box-shadow:0 24px 60px rgba(23,51,46,.14); }
    .login-head { display:grid; justify-items:center; margin-bottom:28px; }
    .login-logo { width:88px; height:88px; margin-bottom:14px; filter:drop-shadow(0 10px 24px rgba(13,60,80,.28)); }
    .login-brand { display:grid; justify-items:center; gap:8px; }
    .login-brand strong { font-size:1.42rem; letter-spacing:.01em; }
    .login-brand small { color:var(--muted); font-size:.72rem; background:#eef4f1; padding:2px 10px; border-radius:999px; }
    .login-card form { display:grid; gap:14px; text-align:left; }
    .login-card label { display:grid; gap:6px; font-size:.9rem; }
    .login-error { margin:0; color:var(--danger); font-size:.85rem; }
    .login-btn { justify-content:center; margin-top:6px; }
  </style>
</head>
<body class="login-body">
<div class="login-card">
  <div class="login-head">
    <img class="login-logo" src="/static/logo.png" alt="DevOps Toolchain">
    <div class="login-brand">
      <strong>DevOps Toolchain</strong>
      <small>__APP_VERSION__</small>
    </div>
  </div>
  <form id="login-form">
    <label>用户名
      <input id="login-username" autocomplete="username" required>
    </label>
    <label>密码
      <input id="login-password" type="password" autocomplete="current-password" required>
    </label>
    <p class="login-error" id="login-error" hidden></p>
    <button class="primary login-btn" type="submit">登录</button>
  </form>
</div>
<script>
  const form = document.getElementById("login-form");
  const errorNode = document.getElementById("login-error");
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    errorNode.hidden = true;
    const username = document.getElementById("login-username").value.trim();
    const password = document.getElementById("login-password").value;
    try {
      const response = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: username, password: password }),
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        errorNode.textContent = data.error || "登录失败，请重试。";
        errorNode.hidden = false;
        return;
      }
      const params = new URLSearchParams(window.location.search);
      window.location.href = params.get("next") || "/";
    } catch (error) {
      errorNode.textContent = "网络异常，请稍后重试。";
      errorNode.hidden = false;
    }
  });
</script>
</body>
</html>
