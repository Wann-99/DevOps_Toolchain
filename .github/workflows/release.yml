name: Build upgrade release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and validate application
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from deploy.build_app_bin import main
          from ksq.upgrade import validate_package, version_tuple
          import sys
          version = os.environ["GITHUB_REF_NAME"]
          version_tuple(version)
          sys.argv = ["build_app_bin.py", version]
          main()
          directory = Path("deploy/dist")
          release = json.loads((directory / "ksq_release.json").read_text())
          validate_package(directory / release["filename"], release)
          PY

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft'); then
            if [[ "$draft" != true ]]; then
              echo "此版本已发布，请使用新版本号，已有附件不会覆盖。" >&2
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --draft --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            "deploy/dist/knowledge_shelf_query_${GITHUB_REF_NAME}.bin" deploy/dist/ksq_release.json
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
