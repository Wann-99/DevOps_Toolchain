# knowledge_shelf_query 标准部署包（固定运行时镜像 + 独立应用包）
# 用法: bash start.sh
services:
  knowledge_shelf_query:
    image: ${RUNTIME_IMAGE:-hub.noematrix.cn/pharmacy/knowledge_shelf_query_runtime:v1.1.0}
    container_name: knowledge_shelf_query
    network_mode: host
    working_dir: /app
    entrypoint: ["python3", "/opt/ksq/knowledge_shelf_query.bin"]
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8765"
      - --knowledge
      - /data/knowledge
      - --shelves
      - /data/config_pnp/sku-shelves.csv
      - --unavailable
      - /data/config_pnp/unavailabel_obj.json
      - --tool-mapping
      - /data/config_pnp/obj_tool_mapping.json
      - --pick-strategy
      - /data/config_pnp/pick_strategy_obj.json
    environment:
      # 容器默认 UTC，会导致备份文件名/订单时间比现场慢 8 小时。
      TZ: ${TZ:-Asia/Shanghai}
      # 可写配置/状态固定在 /app，不跟随应用包的临时解压目录。
      KSQ_APP_DIRECTORY: /app
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # 应用代码单文件；更新该文件并重建容器即可，无需更换镜像。
      - ./bin/knowledge_shelf_query.bin:/opt/ksq/knowledge_shelf_query.bin:ro
      # 状态/配置（start.sh 会自动初始化缺失文件）
      - ./config/dashboard_settings.json:/app/dashboard_settings.json
      - ./config/dashboard_active_order.json:/app/dashboard_active_order.json
      - ./config/test_order_state.json:/app/test_order_state.json
      - ./config/order_config.json:/app/order_config.json
      - ./config/order_config.prod.json:/app/order_config.prod.json
      # 业务数据（设备自带，默认标准布局路径，可用环境变量 CONFIG_PNP_DIR / KNOWLEDGE_DIR 覆盖）
      - ${CONFIG_PNP_DIR:-/home/nvidia/compiled/PNPApp_deploy/config_pnp}:/data/config_pnp
      - ${KNOWLEDGE_DIR:-/home/nvidia/compiled/VfmApp_deploy/model/templates/knowledge}:/data/knowledge
      # 机器人键盘环境（可选）
      - ./robot_keyboard.env:/data/robot_keyboard.env
      # 容器内已包含 Docker CLI / Compose，仅共享宿主 Docker API。
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always
