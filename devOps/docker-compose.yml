# knowledge_shelf_query 独立部署（固定运行时镜像 + 独立应用包）
# 用法:
#   cd deploy && bash up.sh start
# 另一台机器可覆盖外部数据路径:
#   CONFIG_PNP_DIR=/path/to/config_pnp KNOWLEDGE_DIR=/path/to/knowledge bash up.sh start

services:
  knowledge_shelf_query:
    image: ${RUNTIME_IMAGE:-hub.noematrix.cn/pharmacy/knowledge_shelf_query_runtime:v1.1.0}
    container_name: knowledge_shelf_query
    network_mode: host
    working_dir: /app
    entrypoint: ["python3", "/opt/ksq/knowledge_shelf_query.bin"]
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8765"
      - --knowledge
      - /data/knowledge
      - --shelves
      - /data/config_pnp/sku-shelves.csv
      - --unavailable
      - /data/config_pnp/unavailabel_obj.json
      - --tool-mapping
      - /data/config_pnp/obj_tool_mapping.json
      - --pick-strategy
      - /data/config_pnp/pick_strategy_obj.json
    environment:
      # 容器默认 UTC，会导致备份文件名/订单时间比现场慢 8 小时。
      TZ: ${TZ:-Asia/Shanghai}
      KSQ_APP_DIRECTORY: /app
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ../deploy/standalone/bin/knowledge_shelf_query.bin:/opt/ksq/knowledge_shelf_query.bin:ro
      # 项目内可写配置/状态（相对本 compose 文件的上级目录）
      - ../dashboard_settings.json:/app/dashboard_settings.json
      - ../dashboard_active_order.json:/app/dashboard_active_order.json
      - ../test_order_state.json:/app/test_order_state.json
      - ../order_config.json:/app/order_config.json
      - ../order_config.prod.json:/app/order_config.prod.json
      # 现场数据（药库配置 / 知识库）；默认兼容 compiled 同级布局
      - ${CONFIG_PNP_DIR:-/home/nvidia/compiled/PNPApp_deploy/config_pnp}:/data/config_pnp
      - ${KNOWLEDGE_DIR:-/home/nvidia/compiled/VfmApp_deploy/model/templates/knowledge}:/data/knowledge
      - ./robot_keyboard.env:/data/robot_keyboard.env
      # 容器内已包含 Docker CLI / Compose，仅共享宿主 Docker API。
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always
